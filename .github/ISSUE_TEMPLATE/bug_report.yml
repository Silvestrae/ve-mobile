name: Bug report
description: Report a reproducible problem with VE Mobile.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please remove passwords, authentication tokens, private server credentials, and unnecessary sensitive campaign or player material from reports, screenshots, and logs. We also recommend removing your game/server address (URL, hostname, or IP address), including the diagnostic report's "Page" line and any address visible in screenshots. Do not post security-sensitive details publicly. Ask the maintainer for a private reporting channel first, without including exploit details or sensitive data.
  - type: textarea
    id: environment
    attributes:
      label: Versions and device
      description: Include VE Mobile, Foundry, system, browser, device, and OS versions.
      value: |
        VE Mobile version:
        Foundry version:
        Game system and version:
        Browser and version:
        Device/model:
        Operating system:
    validations:
      required: true
  - type: dropdown
    id: presentation
    attributes:
      label: Presentation
      options:
        - Phone
        - Tablet Split
        - Tablet Full
        - Desktop
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Role
      options:
        - Player
        - GM
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the shortest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: modules
    attributes:
      label: Relevant enabled modules
      description: Include versions when known and whether the problem occurs with those modules disabled.
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic report and logs
      description: |
        Please collect the report on the device and browser where the problem happens:
        1. Open VE Mobile Settings, expand Support, and set Diagnostic logging to Detailed diagnostics before reproducing the problem.
        2. Reproduce the problem, then return to Support and select Copy report before reloading or closing the session.
        3. Paste the report below. If copying fails, select Show report and manually copy the text.
        4. Review the text before posting. We recommend removing your game/server address (URL, hostname, or IP address), especially the report's "Page" line. Remove passwords, tokens, credentials, and private campaign or player information too.
        5. Restore your previous Diagnostic logging level after collecting the report.

        Include any relevant browser console errors and their stack traces if available. If you cannot open Settings or collect a report, explain what prevents it below; you can still submit the issue.
      placeholder: Paste your reviewed diagnostic report and relevant errors here, or explain why logs could not be collected.
      render: text
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or video
      description: Attach useful screenshots or video after removing sensitive information. We recommend hiding your game/server address, including the browser address bar.
